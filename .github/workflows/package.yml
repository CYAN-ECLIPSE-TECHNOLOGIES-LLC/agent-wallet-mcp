name: Package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cyan-eclipse-technologies-llc/agent-wallet-mcp:latest
            ghcr.io/cyan-eclipse-technologies-llc/agent-wallet-mcp:${{ github.sha }}
      - name: Smoke (MCP initialize handshake)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' | docker run -i ghcr.io/cyan-eclipse-technologies-llc/agent-wallet-mcp:${{ github.sha }} | grep -q '"result"'
